[project]
name = "dbfaces"
version = "0.2.0"
description = "Loader and metrics for the Danbooru Face Crops 128 dataset (PyTorch and JAX + Grain)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nikhilr612" }]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
# Fetching the dataset and the metric weights from the Hugging Face Hub (a local path needs none of this).
hub = ["huggingface_hub", "safetensors"]
# dbfaces.torch: DataLoader and the PyTorch metrics backend.
torch = ["torch", "safetensors", "huggingface_hub"]
# dbfaces.jax: Grain loader and the JAX metrics backend.
jax = ["jax", "grain", "safetensors", "huggingface_hub"]
# meta.parquet (the table of strings) as a DataFrame.
data = ["pandas", "pyarrow"]
# Palette adherence on generated images needs a parse map: AnimeSeg (no stated licence; see LICENSES.md).
seg = ["anime-seg"]
# Rebuilding the dataset (build/).
build = ["pandas", "pyarrow", "pillow", "requests", "huggingface_hub", "datasets"]
dev = ["dbfaces[torch,jax,data]", "pytest", "ruff", "transformers", "pillow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbfaces"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 180
target-version = "py310"
src = ["src", "tests", "scripts"]
extend-exclude = ["build"]
